<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadForge LLC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 16px 24px;
      margin: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      min-width: 220px;
    }

    .btn-homeowner {
      background: #c40000;
      color: white;
    }

    .btn-contractor {
      background: #222;
      color: white;
    }

    .section {
      margin-top: 40px;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>LeadForge LLC</h1>
    <div class="tagline">We Forge the Leads. You Close the Deals.</div>

    <!-- BUTTONS -->
    <div>
      <a class="btn btn-homeowner" href="index.html">
        I Need a Contractor
      </a>

      <a class="btn btn-contractor" href="contractors.html">
        I’m a Contractor
      </a>
    </div>

    <!-- HOMEOWNER FORM (kept here for now) -->
    <div class="section">
      <h2>Find a Contractor</h2>

      <form id="leadForm">
        <input type="text" id="name" placeholder="Full Name" required /><br>
        <input type="text" id="phone" placeholder="Phone Number" required /><br>
        <input type="email" id="email" placeholder="Email Address" required /><br>
        <input type="text" id="city" placeholder="City" required /><br>
        <input type="text" id="state" placeholder="State" required /><br>
        <input type="text" id="zip_code" placeholder="Zip Code" required /><br>
        <input type="text" id="service" placeholder="Service Needed" required /><br>
        <textarea id="project_details" placeholder="Describe your project" required></textarea><br>

        <button type="submit">Get My Free Quote</button>
      </form>
    </div>

  </div>

  <script>
    document.getElementById("leadForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value,
        zip_code: document.getElementById("zip_code").value,
        service: document.getElementById("service").value,
        project_details: document.getElementById("project_details").value
      };

      try {
        const response = await fetch("https://leadforge-llc.onrender.com/leads", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          alert("Success! Your request has been submitted.");
          document.getElementById("leadForm").reset();
        } else {
          alert("Something went wrong.");
        }
      } catch (error) {
        alert("Error submitting form");
        console.error(error);
      }
    });
  </script>

</body>
</html>
