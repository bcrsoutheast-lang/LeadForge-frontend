<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge</title>
</head>
<body>
  <h1>Lead Form</h1>

  <form id="leadForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="text" id="phone" placeholder="Phone" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="service" placeholder="Service" />
    <input type="text" id="zip_code" placeholder="Zip Code" />
    <textarea id="notes" placeholder="Notes"></textarea>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("leadForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append("name", document.getElementById("name").value);
      formData.append("phone", document.getElementById("phone").value);
      formData.append("email", document.getElementById("email").value);
      formData.append("service", document.getElementById("service").value);
      formData.append("zip_code", document.getElementById("zip_code").value);
      formData.append("notes", document.getElementById("notes").value);

      try {
        const response = await fetch("https://leadforge-llc.onrender.com/lead", {
          method: "POST",
          body: formData
        });

        const result = await response.json();
        alert(JSON.stringify(result));
      } catch (error) {
        alert("Error submitting form");
        console.error(error);
      }
    });
  </script>
</body>
</html>
