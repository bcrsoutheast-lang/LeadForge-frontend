<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Unlock | LeadForge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .locked { background: #fff4e8; color: #c25a00; }
    .unlocked { background: #ebfff0; color: #117a37; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 12px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .item {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .value { font-size: 16px; font-weight: 600; }
    .details-box {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
    }
    .button {
      display: inline-block;
      width: 100%;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .button-orange {
      background: #ff7a00;
      color: #fff;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <div id="statusBadge" class="eyebrow locked">Checking...</div>
      <h1>Exclusive Lead Opportunity</h1>
      <p id="topMessage">Loading...</p>
    </div>

    <div id="leadCard" class="card hidden">
      <h2>Lead Snapshot</h2>
      <div class="grid">
        <div class="item"><div class="label">Service</div><div id="service" class="value"></div></div>
        <div class="item"><div class="label">City</div><div id="city" class="value"></div></div>
        <div class="item"><div class="label">State</div><div id="state" class="value"></div></div>
        <div class="item"><div class="label">ZIP</div><div id="zip" class="value"></div></div>
      </div>
    </div>

    <div id="previewCard" class="card hidden">
      <h2>Preview</h2>
      <div id="previewText" class="details-box"></div>
    </div>

    <div id="unlockedCard" class="card hidden">
      <div class="eyebrow unlocked">Unlocked</div>
      <h2>Homeowner Info</h2>
      <div class="grid">
        <div class="item"><div class="label">Name</div><div id="fullName" class="value"></div></div>
        <div class="item"><div class="label">Phone</div><div id="fullPhone" class="value"></div></div>
        <div class="item"><div class="label">Email</div><div id="fullEmail" class="value"></div></div>
      </div>

      <h2>Project Details</h2>
      <div id="fullDetails" class="details-box"></div>
    </div>

    <div id="lockedCard" class="card hidden">
      <div class="eyebrow locked">Locked</div>
      <h2>Unlock This Lead</h2>

      <a
        class="button button-orange"
        href="https://buy.stripe.com/aFaaEWfL2gzp7QF2TI4ow00"
        target="_blank"
      >
        Unlock for $10
      </a>
    </div>

  </div>

  <script>
    const API = "https://leadforge-llc.onrender.com";
    const id = new URLSearchParams(window.location.search).get("id");

    const statusBadge = document.getElementById("statusBadge");
    const topMessage = document.getElementById("topMessage");

    async function load() {
      if (!id) {
        topMessage.textContent = "Missing lead ID";
        return;
      }

      const status = await fetch(`${API}/leads/${id}/unlock-status`).then(r => r.json());

      document.getElementById("leadCard").classList.remove("hidden");
      document.getElementById("previewCard").classList.remove("hidden");

      const p = status.preview;

      document.getElementById("service").textContent = p.service;
      document.getElementById("city").textContent = p.city;
      document.getElementById("state").textContent = p.state;
      document.getElementById("zip").textContent = p.zip_code;
      document.getElementById("previewText").textContent = p.preview;

      if (status.unlocked) {
        statusBadge.textContent = "Unlocked";
        statusBadge.className = "eyebrow unlocked";
        topMessage.textContent = "Lead unlocked";

        const full = await fetch(`${API}/leads/${id}/full`).then(r => r.json());

        document.getElementById("fullName").textContent = full.name;
        document.getElementById("fullPhone").textContent = full.phone;
        document.getElementById("fullEmail").textContent = full.email;
        document.getElementById("fullDetails").textContent = full.project_details;

        document.getElementById("unlockedCard").classList.remove("hidden");
      } else {
        statusBadge.textContent = "Locked";
        topMessage.textContent = "Unlock to view full details";
        document.getElementById("lockedCard").classList.remove("hidden");
      }
    }

    load();
  </script>
</body>
</html>
