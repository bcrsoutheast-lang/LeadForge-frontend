<!DOCTYPE html>
<html>
<head>
  <title>Lead Unlock</title>
</head>
<body>

<h1>Lead Unlock</h1>

<div id="status">Loading...</div>
<div id="message"></div>

<button id="payBtn" onclick="startCheckout()">Pay $10 to Unlock</button>
<button id="fullBtn" onclick="full()">View Full Lead</button>

<pre id="leadBox" style="white-space: pre-wrap; display: none;"></pre>

<script>
const API = "https://leadforge-llc.onrender.com";
const defaultLeadId = "e27a1c37-d7be-4d6e-b582-6f8982eecf7c";

function getLeadId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("lead_id") || defaultLeadId;
}

function getSessionId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("session_id");
}

function setMessage(text) {
  document.getElementById("message").innerText = text || "";
}

function renderLead(data) {
  const lines = [
    "Name: " + (data.name || ""),
    "Phone: " + (data.phone || ""),
    "Email: " + (data.email || ""),
    "City: " + (data.city || ""),
    "State: " + (data.state || ""),
    "Zip: " + (data.zip_code || ""),
    "Service: " + (data.service || ""),
    "Project Details: " + (data.project_details || ""),
    "Created: " + (data.created_at || "")
  ];

  const box = document.getElementById("leadBox");
  box.style.display = "block";
  box.innerText = lines.join("\n");
}

async function check() {
  const leadId = getLeadId();
  const r = await fetch(API + "/leads/" + leadId + "/unlock-status");
  const d = await r.json();

  if (d.unlocked) {
    document.getElementById("status").innerText = "Unlocked";
    document.getElementById("payBtn").style.display = "none";
  } else {
    document.getElementById("status").innerText = "Locked";
    document.getElementById("payBtn").style.display = "inline-block";
  }
}

async function verifySessionIfPresent() {
  const sessionId = getSessionId();
  if (!sessionId) return;

  setMessage("Payment received. Verifying unlock...");

  const r = await fetch(API + "/payments/verify-session/" + sessionId);
  const d = await r.json();

  if (!r.ok) {
    setMessage(d.detail || "Could not verify Stripe session yet.");
    return;
  }

  if (d.unlocked) {
    setMessage("Payment confirmed. Lead unlocked.");
  } else {
    setMessage("Payment session found, but unlock is not complete yet.");
  }
}

async function startCheckout() {
  const leadId = getLeadId();
  setMessage("Redirecting to secure checkout...");

  const r = await fetch(API + "/leads/" + leadId + "/create-checkout-session", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({})
  });

  const d = await r.json();

  if (!r.ok) {
    setMessage(d.detail || "Could not start checkout.");
    return;
  }

  if (d.checkout_url) {
    window.location.href = d.checkout_url;
    return;
  }

  setMessage("Checkout URL was not returned.");
}

async function full() {
  const leadId = getLeadId();
  const r = await fetch(API + "/leads/" + leadId + "/full");
  const d = await r.json();

  if (!r.ok) {
    setMessage(d.detail || "Lead is still locked.");
    return;
  }

  setMessage("Lead unlocked.");
  renderLead(d);
}

async function init() {
  await verifySessionIfPresent();
  await check();
}

init();
</script>

</body>
</html>
