<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Unlock | LeadForge</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
    }

    .locked {
      background: #fee2e2;
      color: #991b1b;
    }

    .unlocked {
      background: #dcfce7;
      color: #166534;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 10px;
      width: 100%;
      cursor: pointer;
    }

    .btn1 { background: #111827; color: white; }
    .btn2 { background: #16a34a; color: white; }

    .field {
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #6b7280;
      font-weight: bold;
    }

    .value {
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LeadForge</h1>

    <div class="card">
      <h3>Lead Status</h3>
      <div id="status" class="status locked">Loading...</div>

      <button class="btn2" onclick="unlock()">Test Unlock</button>
      <button class="btn1" onclick="loadFull()">View Full Lead</button>
    </div>

    <div class="card">
      <h3>Preview</h3>

      <div class="field">
        <div class="label">Service</div>
        <div id="service" class="value">—</div>
      </div>

      <div class="field">
        <div class="label">Zip</div>
        <div id="zip" class="value">—</div>
      </div>

      <div class="field">
        <div class="label">Project</div>
        <div id="project" class="value">—</div>
      </div>
    </div>

    <div class="card">
      <h3>Full Lead</h3>

      <div class="field">
        <div class="label">Name</div>
        <div id="name" class="value">Locked</div>
      </div>

      <div class="field">
        <div class="label">Phone</div>
        <div id="phone" class="value">Locked</div>
      </div>

      <div class="field">
        <div class="label">Email</div>
        <div id="email" class="value">Locked</div>
      </div>

      <div class="field">
        <div class="label">Address</div>
        <div id="address" class="value">Locked</div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://leadforge-llc.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "e27a1c37-d7be-4d6e-b582-6f8982eecf7c";

    async function loadPreview() {
      const res = await fetch(`${API}/leads/${id}/preview`);
      const data = await res.json();

      document.getElementById("service").textContent = data.service_type || "—";
      document.getElementById("zip").textContent = data.zip_code || "—";
      document.getElementById("project").textContent = data.project_description || "—";
    }

    async function checkStatus() {
      const res = await fetch(`${API}/leads/${id}/unlock-status`);
      const data = await res.json();

      const status = document.getElementById("status");

      if (data.unlocked) {
        status.textContent = "Unlocked";
        status.className = "status unlocked";
      } else {
        status.textContent = "Locked";
        status.className = "status locked";
      }
    }

    async function unlock() {
      await fetch(`${API}/leads/${id}/test-unlock`, { method: "POST" });
      checkStatus();
    }

    async function loadFull() {
      const res = await fetch(`${API}/leads/${id}/full`);
      const data = await res.json();

      document.getElementById("name").textContent = data.homeowner_name || "—";
      document.getElementById("phone").textContent = data.phone || "—";
      document.getElementById("email").textContent = data.email || "—";
      document.getElementById("address").textContent = data.address || "—";
    }

    loadPreview();
    checkStatus();
  </script>
</body>
</html>
