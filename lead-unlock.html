<!DOCTYPE html>
<html>
<head>
  <title>Lead Unlock</title>
</head>
<body>

<h1>Lead Unlock Test</h1>

<div id="status">Loading...</div>

<button onclick="unlock()">Unlock</button>
<button onclick="full()">Full Lead</button>

<script>
const API = "https://leadforge-llc.onrender.com";
const id = "e27a1c37-d7be-4d6e-b582-6f8982eecf7c";

async function check() {
  let r = await fetch(API + "/leads/" + id + "/unlock-status");
  let d = await r.json();
  document.getElementById("status").innerText = d.unlocked ? "Unlocked" : "Locked";
}

async function unlock() {
  await fetch(API + "/leads/" + id + "/test-unlock", {method:"POST"});
  check();
}

async function full() {
  let r = await fetch(API + "/leads/" + id + "/full");
  let d = await r.json();
  alert(JSON.stringify(d));
}

check();
</script>

</body>
</html>
