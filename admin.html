<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 16px 0;
      color: #6b7280;
      font-size: 14px;
      word-break: break-word;
    }

    .bar {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .status {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-btn {
      background: #111827;
      color: white;
    }

    .approve-btn {
      background: #16a34a;
      color: white;
    }

    .reject-btn {
      background: #dc2626;
      color: white;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
    }

    .section-title {
      margin: 18px 0 10px 0;
      font-size: 18px;
    }

    .raw-box {
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .cards {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }

    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .approved {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .field {
      margin-bottom: 8px;
      font-size: 14px;
      word-break: break-word;
    }

    .label {
      font-weight: 700;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 24px;
      }

      button {
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>LeadForge Admin Panel</h1>
    <p class="sub">Backend: https://leadforge-llc.onrender.com/admin</p>

    <div class="bar">
      <div class="status" id="statusText">Starting...</div>
      <div class="small" id="statusSub">Waiting to load data</div>
      <div class="actions">
        <button class="refresh-btn" id="refreshBtn">Refresh Contractors</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="summary-label">Total</div>
        <div class="summary-value" id="totalCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Pending</div>
        <div class="summary-value" id="pendingCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Approved</div>
        <div class="summary-value" id="approvedCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Rejected</div>
        <div class="summary-value" id="rejectedCount">0</div>
      </div>
    </div>

    <h2 class="section-title">Raw API Response</h2>
    <div id="rawResponse" class="raw-box">Nothing loaded yet</div>

    <h2 class="section-title">Rendered Contractors</h2>
    <div id="cards" class="cards"></div>
  </div>

  <script>
    const ADMIN_URL = "https://leadforge-llc.onrender.com/admin";
    const APPROVE_URL = "https://leadforge-llc.onrender.com/contractors/approve/";
    const REJECT_URL = "https://leadforge-llc.onrender.com/contractors/reject/";

    const statusText = document.getElementById("statusText");
    const statusSub = document.getElementById("statusSub");
    const rawResponse = document.getElementById("rawResponse");
    const cards = document.getElementById("cards");
    const refreshBtn = document.getElementById("refreshBtn");

    const totalCount = document.getElementById("totalCount");
    const pendingCount = document.getElementById("pendingCount");
    const approvedCount = document.getElementById("approvedCount");
    const rejectedCount = document.getElementById("rejectedCount");

    function setStatus(main, sub) {
      statusText.textContent = main;
      statusSub.textContent = sub || "";
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getField(obj, names) {
      for (const name of names) {
        if (obj && obj[name] !== undefined && obj[name] !== null && obj[name] !== "") {
          return obj[name];
        }
      }
      return "";
    }

    function getStatus(item) {
      const s = String(getField(item, ["status", "approval_status"])).toLowerCase();
      const approved = getField(item, ["approved", "is_approved"]);

      if (s.includes("approve")) return "approved";
      if (s.includes("reject")) return "rejected";
      if (approved === true) return "approved";
      if (approved === false && s) return "rejected";
      return "pending";
    }

    function normalizeData(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.contractors)) return data.contractors;
      if (data && Array.isArray(data.data)) return data.data;
      if (data && Array.isArray(data.results)) return data.results;
      return [];
    }

    function updateCounts(list) {
      const total = list.length;
      const pending = list.filter(x => getStatus(x) === "pending").length;
      const approved = list.filter(x => getStatus(x) === "approved").length;
      const rejected = list.filter(x => getStatus(x) === "rejected").length;

      totalCount.textContent = total;
      pendingCount.textContent = pending;
      approvedCount.textContent = approved;
      rejectedCount.textContent = rejected;
    }

    function renderCards(list) {
      if (!list.length) {
        cards.innerHTML = '<div class="empty">No contractor records rendered.</div>';
        return;
      }

      cards.innerHTML = list.map(item => {
        const id = getField(item, ["id"]);
        const name = getField(item, ["name", "full_name", "contractor_name", "company_name", "business_name"]) || "Unnamed Contractor";
        const email = getField(item, ["email"]);
        const phone = getField(item, ["phone", "phone_number", "mobile"]);
        const company = getField(item, ["company", "company_name", "business_name"]);
        const service = getField(item, ["service", "services", "trade", "category"]);
        const city = getField(item, ["city"]);
        const state = getField(item, ["state"]);
        const zip = getField(item, ["zip", "zipcode", "postal_code"]);
        const created = getField(item, ["created_at", "submitted_at", "date_created"]);
        const notes = getField(item, ["notes", "message", "description"]);
        const status = getStatus(item);

        return `
          <div class="card">
            <h3>${escapeHtml(name)}</h3>
            <div class="pill ${status}">${escapeHtml(status)}</div>

            <div class="field"><span class="label">ID:</span> ${escapeHtml(id || "—")}</div>
            <div class="field"><span class="label">Company:</span> ${escapeHtml(company || "—")}</div>
            <div class="field"><span class="label">Email:</span> ${escapeHtml(email || "—")}</div>
            <div class="field"><span class="label">Phone:</span> ${escapeHtml(phone || "—")}</div>
            <div class="field"><span class="label">Service:</span> ${escapeHtml(service || "—")}</div>
            <div class="field"><span class="label">City:</span> ${escapeHtml(city || "—")}</div>
            <div class="field"><span class="label">State:</span> ${escapeHtml(state || "—")}</div>
            <div class="field"><span class="label">Zip:</span> ${escapeHtml(zip || "—")}</div>
            <div class="field"><span class="label">Created:</span> ${escapeHtml(created || "—")}</div>
            <div class="field"><span class="label">Notes:</span> ${escapeHtml(notes || "—")}</div>

            <div class="actions">
              <button class="approve-btn" onclick="approveContractor('${escapeHtml(String(id || ""))}')" ${id ? "" : "disabled"}>Approve</button>
              <button class="reject-btn" onclick="rejectContractor('${escapeHtml(String(id || ""))}')" ${id ? "" : "disabled"}>Reject</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadData() {
      setStatus("Loading...", "Requesting contractor data from backend");
      rawResponse.textContent = "Loading...";
      cards.innerHTML = "";

      try {
        const response = await fetch(ADMIN_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        const text = await response.text();
        rawResponse.textContent = text;

        if (!response.ok) {
          setStatus("Load failed", response.status + " " + response.statusText);
          cards.innerHTML = '<div class="empty">Backend returned an error.</div>';
          updateCounts([]);
          return;
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (jsonError) {
          setStatus("JSON parse failed", "Response was not valid JSON");
          cards.innerHTML = '<div class="empty">Response was not valid JSON.</div>';
          updateCounts([]);
          return;
        }

        const list = normalizeData(data);
        updateCounts(list);
        renderCards(list);

        setStatus("Load complete", "Found " + list.length + " contractor record(s)");
      } catch (error) {
        rawResponse.textContent = String(error);
        cards.innerHTML = '<div class="empty">Could not load backend data.</div>';
        updateCounts([]);
        setStatus("Request error", error.message);
      }
    }

    async function approveContractor(id) {
      if (!id) {
        setStatus("Approve failed", "Missing contractor id");
        return;
      }

      setStatus("Approving contractor...", id);

      try {
        const response = await fetch(APPROVE_URL + encodeURIComponent(id), {
          method: "POST"
        });

        const text = await response.text();

        if (!response.ok) {
          setStatus("Approve failed", text || (response.status + " " + response.statusText));
          return;
        }

        setStatus("Approved", "Contractor " + id + " approved");
        await loadData();
      } catch (error) {
        setStatus("Approve error", error.message);
      }
    }

    async function rejectContractor(id) {
      if (!id) {
        setStatus("Reject failed", "Missing contractor id");
        return;
      }

      setStatus("Rejecting contractor...", id);

      try {
        const response = await fetch(REJECT_URL + encodeURIComponent(id), {
          method: "POST"
        });

        const text = await response.text();

        if (!response.ok) {
          setStatus("Reject failed", text || (response.status + " " + response.statusText));
          return;
        }

        setStatus("Rejected", "Contractor " + id + " rejected");
        await loadData();
      } catch (error) {
        setStatus("Reject error", error.message);
      }
    }

    refreshBtn.addEventListener("click", loadData);

    window.approveContractor = approveContractor;
    window.rejectContractor = rejectContractor;

    loadData();
  </script>
</body>
</html>
