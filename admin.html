<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadForge Admin</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve {
      background: #16a34a;
      color: #fff;
    }

    .reject {
      background: #dc2626;
      color: #fff;
    }

    .status {
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>LeadForge Admin</h1>

  <div id="status">Loading...</div>
  <div id="list"></div>

  <script>
    const API = "https://leadforge-llc.onrender.com";

    function setStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    function load() {
      setStatus("Fetching contractors...");

      fetch(API + "/admin")
        .then(res => {
          if (!res.ok) {
            throw new Error("Request failed: " + res.status);
          }
          return res.json();
        })
        .then(data => {
          setStatus("Loaded " + (data.length || 0) + " contractors");

          const list = document.getElementById("list");
          list.innerHTML = "";

          if (!Array.isArray(data) || data.length === 0) {
            list.innerHTML = "<div class='card'>No contractors found.</div>";
            return;
          }

          data.forEach(c => {
            const div = document.createElement("div");
            div.className = "card";

            div.innerHTML = `
              <strong>${c.name || "No Name"}</strong><br>
              ${c.email || ""}<br>
              ${c.phone || ""}<br>
              <div class="status">Status: ${c.status || "pending"}</div>
              <button class="approve" onclick="approve('${c.id}')">Approve</button>
              <button class="reject" onclick="reject('${c.id}')">Reject</button>
            `;

            list.appendChild(div);
          });
        })
        .catch(err => {
          setStatus("ERROR: " + err.message);
        });
    }

    function approve(id) {
      fetch(API + "/contractors/approve/" + id, { method: "POST" })
        .then(() => load())
        .catch(err => alert("Approve failed: " + err.message));
    }

    function reject(id) {
      fetch(API + "/contractors/reject/" + id, { method: "POST" })
        .then(() => load())
        .catch(err => alert("Reject failed: " + err.message));
    }

    load();
  </script>

</body>
</html>
