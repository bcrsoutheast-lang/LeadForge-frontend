<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge Admin</title>
</head>
<body style="font-family:Arial;padding:20px;background:#111;color:white;">

<h1>LeadForge Admin Panel</h1>

<button onclick="loadData()">Refresh</button>

<div id="output" style="margin-top:20px;"></div>

<script>
const API = "https://leadforge-llc.onrender.com/admin";

async function loadData() {
  const out = document.getElementById("output");
  out.innerHTML = "Loading...";

  try {
    const res = await fetch(API);
    const data = await res.json();

    console.log(data);

    if (!Array.isArray(data)) {
      out.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      return;
    }

    out.innerHTML = data.map(c => `
      <div style="border:1px solid #444;padding:10px;margin-bottom:10px;">
        <b>${c.name || "No Name"}</b><br/>
        ${c.email || ""}<br/>
        ${c.phone || ""}<br/>
        Status: ${c.status || "pending"}<br/><br/>

        <button onclick="approve('${c.id}')">Approve</button>
        <button onclick="reject('${c.id}')">Reject</button>
      </div>
    `).join("");

  } catch (e) {
    out.innerHTML = "ERROR: " + e.message;
  }
}

async function approve(id) {
  await fetch("https://leadforge-llc.onrender.com/contractors/approve/" + id, {method:"POST"});
  loadData();
}

async function reject(id) {
  await fetch("https://leadforge-llc.onrender.com/contractors/reject/" + id, {method:"POST"});
  loadData();
}

loadData();
</script>

</body>
</html>
