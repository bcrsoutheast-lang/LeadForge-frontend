<!DOCTYPE html>
<html>
<head>
  <title>LeadForge Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 12px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .approve {
      background: green;
      color: white;
    }

    .reject {
      background: red;
      color: white;
    }

    .muted {
      color: #666;
    }
  </style>
</head>
<body>

<h1>LeadForge Admin</h1>

<div id="list">Loading...</div>

<script>
const API = "https://leadforge-llc.onrender.com";

function load() {
  fetch(API + "/admin")
    .then(res => {
      if (!res.ok) {
        throw new Error("Failed to load admin data");
      }
      return res.json();
    })
    .then(data => {
      const list = document.getElementById("list");
      list.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        list.innerHTML = "<div class='card muted'>No contractors found.</div>";
        return;
      }

      data.forEach(c => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <b>${c.name || "No Name"}</b><br>
          ${c.email || ""}<br>
          ${c.phone || ""}<br>
          Status: ${c.status || "pending"}<br>
          <button class="approve" onclick="approve('${c.id}')">Approve</button>
          <button class="reject" onclick="reject('${c.id}')">Reject</button>
        `;

        list.appendChild(div);
      });
    })
    .catch(err => {
      document.getElementById("list").innerHTML =
        "<div class='card'>Error: " + err.message + "</div>";
    });
}

function approve(id) {
  fetch(API + "/contractors/approve/" + id, { method: "POST" })
    .then(() => load())
    .catch(err => {
      alert("Approve failed: " + err.message);
    });
}

function reject(id) {
  fetch(API + "/contractors/reject/" + id, { method: "POST" })
    .then(() => load())
    .catch(err => {
      alert("Reject failed: " + err.message);
    });
}

load();
</script>

</body>
</html>
