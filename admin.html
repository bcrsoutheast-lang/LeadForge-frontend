<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
</head>
<body>

<h2>Admin Panel</h2>
<div id="list">Loading...</div>

<script>
const API = "https://leadforge-llc.onrender.com";

async function load() {
    const res = await fetch(API + "/admin");
    const data = await res.json();

    const container = document.getElementById("list");
    container.innerHTML = "";

    data.forEach(c => {
        const div = document.createElement("div");

        div.innerHTML = `
            <b>${c.name}</b><br>
            ${c.email}<br>
            ${c.phone}<br><br>

            <button onclick="approve('${c.id}')">Approve</button>
            <button onclick="reject('${c.id}')">Reject</button>
            <hr>
        `;

        container.appendChild(div);
    });
}

async function approve(id) {
    await fetch(API + "/contractors/approve/" + id, { method: "POST" });
    load();
}

async function reject(id) {
    await fetch(API + "/contractors/reject/" + id, { method: "POST" });
    load();
}

load();
</script>

</body>
</html>
