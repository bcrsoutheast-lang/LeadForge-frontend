<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #d1d5db;
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px 40px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .top-bar a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    .refresh-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #1d4ed8;
    }

    .status-message {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th,
    td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #6b7280;
    }

    tr:hover {
      background: #f9fafb;
    }

    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-approved {
      background: #dcfce7;
      color: #166534;
    }

    .badge-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .btn-approve {
      background: #16a34a;
    }

    .btn-approve:hover {
      background: #15803d;
    }

    .btn-reject {
      background: #dc2626;
    }

    .btn-reject:hover {
      background: #b91c1c;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty-state,
    .loading-state {
      background: white;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .small {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.4;
    }

    @media (max-width: 700px) {
      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LeadForge Admin Panel</h1>
    <p>Review contractors, approve listings, and control what appears publicly.</p>
  </div>

  <div class="container">
    <div class="top-bar">
      <a href="/contractors.html">← View Public Contractors Page</a>
      <button class="refresh-btn" id="refreshButton">Refresh</button>
    </div>

    <div id="successMessage" class="status-message status-success"></div>
    <div id="errorMessage" class="status-message status-error"></div>

    <div id="loadingState" class="loading-state">Loading contractors...</div>
    <div id="emptyState" class="empty-state" style="display: none;">No contractors found.</div>

    <div id="tableWrap" class="table-wrap" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Business</th>
            <th>Contact</th>
            <th>Location</th>
            <th>Category</th>
            <th>Services</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contractorTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "https://leadforge-llc.onrender.com";

    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const tableWrap = document.getElementById("tableWrap");
    const contractorTableBody = document.getElementById("contractorTableBody");
    const refreshButton = document.getElementById("refreshButton");
    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");

    function showSuccess(message) {
      successMessage.style.display = "block";
      errorMessage.style.display = "none";
      successMessage.textContent = message;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showError(message) {
      errorMessage.style.display = "block";
      successMessage.style.display = "none";
      errorMessage.textContent = message;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearMessages() {
      successMessage.style.display = "none";
      errorMessage.style.display = "none";
      successMessage.textContent = "";
      errorMessage.textContent = "";
    }

    function safeValue(value, fallback = "—") {
      if (value === null || value === undefined || String(value).trim() === "") {
        return fallback;
      }
      return String(value);
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function getStatusBadge(statusValue, approvedValue) {
      let status = "";
      if (statusValue && String(statusValue).trim() !== "") {
        status = String(statusValue).toLowerCase();
      } else if (approvedValue === true) {
        status = "approved";
      } else {
        status = "pending";
      }

      const badge = document.createElement("span");
      badge.className = "badge";

      if (status === "approved") {
        badge.classList.add("badge-approved");
      } else if (status === "rejected") {
        badge.classList.add("badge-rejected");
      } else {
        badge.classList.add("badge-pending");
      }

      badge.textContent = status;
      return badge;
    }

    async function loadContractors() {
      clearMessages();
      loadingState.style.display = "block";
      emptyState.style.display = "none";
      tableWrap.style.display = "none";
      contractorTableBody.innerHTML = "";

      try {
        const response = await fetch(`${API_BASE}/admin`);
        if (!response.ok) {
          throw new Error("Could not load contractors.");
        }

        const contractors = await response.json();

        loadingState.style.display = "none";

        if (!Array.isArray(contractors) || contractors.length === 0) {
          emptyState.style.display = "block";
          return;
        }

        contractors.forEach((contractor) => {
          const row = document.createElement("tr");

          const id = contractor.id;
          const businessName = safeValue(contractor.business_name);
          const contactName = safeValue(contractor.contact_name);
          const city = safeValue(contractor.city, "");
          const state = safeValue(contractor.state, "");
          const location = [city, state].filter(v => v && v !== "—").join(", ") || "—";
          const category = safeValue(contractor.category);
          const services = safeValue(contractor.services);
          const website = safeValue(contractor.website, "");
          const createdAt = formatDate(contractor.created_at);

          const idCell = document.createElement("td");
          idCell.textContent = safeValue(id);

          const businessCell = document.createElement("td");
          businessCell.innerHTML = `
            <strong>${businessName}</strong>
            <div class="small">${safeValue(contractor.email)}</div>
          `;

          const contactCell = document.createElement("td");
          contactCell.innerHTML = `
            <div>${contactName}</div>
            <div class="small">${safeValue(contractor.phone)}</div>
          `;

          const locationCell = document.createElement("td");
          locationCell.textContent = location;

          const categoryCell = document.createElement("td");
          categoryCell.textContent = category;

          const servicesCell = document.createElement("td");
          servicesCell.innerHTML = `
            <div>${services}</div>
            ${website && website !== "—" ? `<div class="small">${website}</div>` : ""}
          `;

          const statusCell = document.createElement("td");
          statusCell.appendChild(getStatusBadge(contractor.status, contractor.approved));

          const createdCell = document.createElement("td");
          createdCell.textContent = createdAt;

          const actionsCell = document.createElement("td");
          const actionsWrap = document.createElement("div");
          actionsWrap.className = "actions";

          const approveButton = document.createElement("button");
          approveButton.className = "btn btn-approve";
          approveButton.textContent = "Approve";
          approveButton.onclick = () => updateContractorStatus(id, "approve", approveButton, rejectButton);

          const rejectButton = document.createElement("button");
          rejectButton.className = "btn btn-reject";
          rejectButton.textContent = "Reject";
          rejectButton.onclick = () => updateContractorStatus(id, "reject", approveButton, rejectButton);

          actionsWrap.appendChild(approveButton);
          actionsWrap.appendChild(rejectButton);
          actionsCell.appendChild(actionsWrap);

          row.appendChild(idCell);
          row.appendChild(businessCell);
          row.appendChild(contactCell);
          row.appendChild(locationCell);
          row.appendChild(categoryCell);
          row.appendChild(servicesCell);
          row.appendChild(statusCell);
          row.appendChild(createdCell);
          row.appendChild(actionsCell);

          contractorTableBody.appendChild(row);
        });

        tableWrap.style.display = "block";
      } catch (error) {
        loadingState.style.display = "none";
        showError(error.message || "Could not load contractors.");
      }
    }

    async function updateContractorStatus(contractorId, action, approveButton, rejectButton) {
      clearMessages();

      if (!contractorId && contractorId !== 0) {
        showError("Missing contractor ID.");
        return;
      }

      const endpoint =
        action === "approve"
          ? `${API_BASE}/contractors/approve/${contractorId}`
          : `${API_BASE}/contractors/reject/${contractorId}`;

      approveButton.disabled = true;
      rejectButton.disabled = true;

      const originalApproveText = approveButton.textContent;
      const originalRejectText = rejectButton.textContent;

      if (action === "approve") {
        approveButton.textContent = "Approving...";
      } else {
        rejectButton.textContent = "Rejecting...";
      }

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({})
        });

        let result = {};
        try {
          result = await response.json();
        } catch (e) {}

        if (!response.ok) {
          const message = result.detail || result.message || `Could not ${action} contractor.`;
          throw new Error(message);
        }

        showSuccess(result.message || `Contractor ${action}d successfully.`);
        await loadContractors();
      } catch (error) {
        showError(error.message || `Could not ${action} contractor.`);
      } finally {
        approveButton.disabled = false;
        rejectButton.disabled = false;
        approveButton.textContent = originalApproveText;
        rejectButton.textContent = originalRejectText;
      }
    }

    refreshButton.addEventListener("click", loadContractors);

    loadContractors();
  </script>
</body>
</html>
