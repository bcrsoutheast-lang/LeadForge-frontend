<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        button {
            margin-right: 10px;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
        }
        .approve { background: green; color: white; }
        .reject { background: red; color: white; }
    </style>
</head>

<body>

<h2>Admin Panel</h2>
<div id="list">Loading...</div>

<script>
const API = "https://leadforge-llc.onrender.com";

async function load() {
    const res = await fetch(API + "/admin");
    const data = await res.json();

    const container = document.getElementById("list");
    container.innerHTML = "";

    data.forEach(c => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${c.name}</b><br>
            ${c.email}<br>
            ${c.phone}<br><br>

            <button class="approve" onclick="approve('${c.id}')">Approve</button>
            <button class="reject" onclick="reject('${c.id}')">Reject</button>
        `;

        container.appendChild(div);
    });
}

async function approve(id) {
    await fetch(API + "/contractors/approve/" + id, { method: "POST" });
    load();
}

async function reject(id) {
    await fetch(API + "/contractors/reject/" + id, { method: "POST" });
    load();
}

load();
</script>

</body>
</html>
