<!DOCTYPE html>
<html>
<head>
  <title>LeadForge Admin</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { margin-bottom: 20px; }
    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    .approve { background: green; color: white; }
    .reject { background: red; color: white; }
  </style>
</head>
<body>

<h1>LeadForge Admin</h1>

<div id="list">Loading...</div>

<script>
const API = "https://leadforge-llc.onrender.com";

function load() {
  fetch(API + "/admin")
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById("list");
      list.innerHTML = "";

      data.forEach(c => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <b>${c.name || "No Name"}</b><br>
          ${c.email || ""}<br>
          ${c.phone || ""}<br>
          Status: ${c.status || "pending"}<br>
          <button class="approve" onclick="approve('${c.id}')">Approve</button>
          <button class="reject" onclick="reject('${c.id}')">Reject</button>
        `;

        list.appendChild(div);
      });
    });
}

function approve(id) {
  fetch(API + "/contractors/approve/" + id, { method: "POST" })
    .then(() => load());
}

function reject(id) {
  fetch(API + "/contractors/reject/" + id, { method: "POST" })
    .then(() => load());
}

load();
</script>

</body>
</html>
