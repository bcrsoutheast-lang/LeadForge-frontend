<!DOCTYPE html>
<html>
<head>
  <title>Admin Debug</title>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:20px;">

<h1>ADMIN DEBUG PANEL</h1>

<button onclick="load()">LOAD DATA</button>

<h3>Status:</h3>
<div id="status">Waiting...</div>

<h3>Raw Response:</h3>
<pre id="raw" style="background:#000;padding:10px;"></pre>

<h3>Rendered:</h3>
<div id="render"></div>

<script>
const URL = "https://leadforge-llc.onrender.com/admin";

async function load() {
  document.getElementById("status").innerText = "Loading...";
  document.getElementById("raw").innerText = "";
  document.getElementById("render").innerHTML = "";

  try {
    const res = await fetch(URL);
    const text = await res.text();

    document.getElementById("raw").innerText = text;

    if (!res.ok) {
      document.getElementById("status").innerText = "ERROR: " + res.status;
      return;
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      document.getElementById("status").innerText = "NOT JSON";
      return;
    }

    document.getElementById("status").innerText = "SUCCESS";

    let list = [];

    if (Array.isArray(data)) list = data;
    else if (Array.isArray(data.contractors)) list = data.contractors;
    else if (Array.isArray(data.data)) list = data.data;
    else {
      document.getElementById("render").innerText = "Unknown format";
      return;
    }

    document.getElementById("render").innerHTML = list.map(c => `
      <div style="border:1px solid #555;margin:10px;padding:10px;">
        <b>${c.name || "No name"}</b><br>
        ${c.email || ""}<br>
        ${c.phone || ""}<br>
        ID: ${c.id || "NO ID"}<br>
      </div>
    `).join("");

  } catch (e) {
    document.getElementById("status").innerText = "FETCH ERROR: " + e.message;
  }
}

load();
</script>

</body>
</html>
