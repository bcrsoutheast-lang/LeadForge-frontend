<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contractor Join | LeadForge LLC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .section-title {
      margin-top: 20px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      font-weight: bold;
      color: black;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Join LeadForge</h1>
    <p>Apply to join our vetted contractor network</p>

    <form id="contractorForm">

      <div class="section-title">Public Profile</div>

      <input type="text" id="company_name" placeholder="Company Name" required />
      <input type="text" id="owner_name" placeholder="Owner Name" required />
      <input type="text" id="business_type" placeholder="Business Type (Roofing, HVAC, etc.)" required />
      <input type="text" id="service_area" placeholder="Service Area" required />
      <input type="text" id="crew_size" placeholder="Crew Size" required />
      <input type="text" id="years_in_business" placeholder="Years in Business" required />
      <textarea id="bio" placeholder="Company Bio" required></textarea>

      <div class="section-title">Verification Info</div>

      <input type="text" id="phone" placeholder="Phone Number" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="text" id="license_number" placeholder="License Number" required />
      <input type="text" id="insurance_type" placeholder="Insurance Type" required />
      <input type="text" id="insurance_coverage" placeholder="Insurance Coverage" required />

      <textarea id="notes" placeholder="Additional Notes"></textarea>

      <button type="submit">Apply to Join</button>

    </form>

  </div>

  <script>
    document.getElementById("contractorForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = {
        company_name: document.getElementById("company_name").value,
        owner_name: document.getElementById("owner_name").value,
        business_type: document.getElementById("business_type").value,
        service_area: document.getElementById("service_area").value,
        crew_size: document.getElementById("crew_size").value,
        years_in_business: document.getElementById("years_in_business").value,
        bio: document.getElementById("bio").value,

        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        license_number: document.getElementById("license_number").value,
        insurance_type: document.getElementById("insurance_type").value,
        insurance_coverage: document.getElementById("insurance_coverage").value,

        notes: document.getElementById("notes").value
      };

      try {
        const response = await fetch("https://leadforge-llc.onrender.com/contractors", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          alert("Success! Application submitted.");
          document.getElementById("contractorForm").reset();
        } else {
          alert("Something went wrong.");
        }
      } catch (error) {
        alert("Error submitting form");
        console.error(error);
      }
    });
  </script>

</body>
</html>
