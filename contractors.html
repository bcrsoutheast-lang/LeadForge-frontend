<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contractor Join | LeadForge LLC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Join LeadForge</h1>

    <form id="contractorForm">
      <input type="text" id="company_name" placeholder="Company Name" required />
      <input type="text" id="contact_name" placeholder="Contact Name" required />
      <input type="text" id="phone" placeholder="Phone Number" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="text" id="services_offered" placeholder="Services Offered" required />
      <input type="text" id="service_area" placeholder="Service Area" required />
      <input type="text" id="licensed_insured" placeholder="Licensed / Insured? (Yes/No)" required />
      <textarea id="notes" placeholder="Anything else we should know?"></textarea>

      <button type="submit">Apply to Join</button>
    </form>
  </div>

  <script>
    document.getElementById("contractorForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = {
        company_name: document.getElementById("company_name").value,
        contact_name: document.getElementById("contact_name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        services_offered: document.getElementById("services_offered").value,
        service_area: document.getElementById("service_area").value,
        licensed_insured: document.getElementById("licensed_insured").value,
        notes: document.getElementById("notes").value
      };

      try {
        const response = await fetch("https://leadforge-llc.onrender.com/contractors", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          alert("Success! Your contractor application has been submitted.");
          document.getElementById("contractorForm").reset();
        } else {
          alert("Something went wrong.");
        }
      } catch (error) {
        alert("Error submitting form");
        console.error(error);
      }
    });
  </script>

</body>
</html>
