<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contractor Signup</title>
</head>

<body>

<h2>Contractor Signup</h2>

<form id="form">
<input id="first_name" placeholder="First Name" required><br>
<input id="last_name" placeholder="Last Name" required><br>
<input id="business_name" placeholder="Business Name" required><br>
<input id="email" placeholder="Email" required><br>
<input id="phone" placeholder="Phone" required><br>
<input id="trade" placeholder="Trade" required><br>
<input id="service_area" placeholder="Service Area" required><br>

<label>
<input type="checkbox" id="agree">
I agree to terms
</label><br><br>

<button type="submit">Submit</button>

</form>

<div id="msg"></div>

<script>

const API_BASE = "https://leadforge-llc.onrender.com";

const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
e.preventDefault();

if (!document.getElementById("agree").checked) {
msg.innerHTML = "Must agree to terms";
return;
}

const data = {
first_name: first_name.value,
last_name: last_name.value,
business_name: business_name.value,
email: email.value,
phone: phone.value,
trade: trade.value,
service_area: service_area.value,
agreed_to_terms: true,
agreement_version: "v1.0"
};

try {
const res = await fetch(`${API_BASE}/contractors`, {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify(data)
});

const result = await res.json();

msg.innerHTML = "Submitted successfully";

} catch (err) {
msg.innerHTML = "Error submitting";
}

});

</script>

</body>
</html>
