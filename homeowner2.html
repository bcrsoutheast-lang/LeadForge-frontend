<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find a Contractor | LeadForge</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .contractor {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .contractor.selected {
      border-color: #111;
    }

    form {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: red;
      color: white;
      border: none;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }

    .debug {
      margin-top: 20px;
      font-size: 12px;
      background: #000;
      color: #0f0;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Choose Your Contractor</h1>

  <div id="contractorList">Loading contractors...</div>

  <form id="leadForm">

    <h2>Your Information</h2>

    <input id="name" placeholder="Full Name" required />
    <input id="phone" placeholder="Phone" required />
    <input id="email" placeholder="Email" required />

    <h2>Location</h2>

    <input id="city" placeholder="City" required />
    <input id="state" placeholder="State" required />
    <input id="zip" placeholder="Zip Code" required />

    <h2>Project</h2>

    <input id="service" placeholder="Type of Service (roof, fence, HVAC, etc)" required />
    <textarea id="details" placeholder="Describe your project..." required></textarea>

    <button type="submit">Submit Request</button>

    <div class="status" id="status"></div>
    <div class="debug" id="debug"></div>

  </form>

</div>

<script>
const API = "https://leadforge-llc.onrender.com";

let selectedContractor = null;

async function loadContractors() {
  try {
    const res = await fetch(API + "/contractors");
    const data = await res.json();

    const list = document.getElementById("contractorList");
    list.innerHTML = "";

    data.forEach(c => {
      const div = document.createElement("div");
      div.className = "contractor";

      div.innerHTML = `
        <strong>${c.company_name}</strong><br>
        ${c.service_type}<br>
        ${c.city || ""}
      `;

      div.onclick = () => {
        document.querySelectorAll(".contractor").forEach(el => el.classList.remove("selected"));
        div.classList.add("selected");
        selectedContractor = c;
      };

      list.appendChild(div);
    });

  } catch (err) {
    document.getElementById("contractorList").innerText = "Error loading contractors";
  }
}

document.getElementById("leadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const status = document.getElementById("status");
  const debug = document.getElementById("debug");

  if (!selectedContractor) {
    status.innerText = "Please select a contractor";
    return;
  }

  const payload = {
    homeowner_name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,

    city: document.getElementById("city").value,
    state: document.getElementById("state").value,
    zip_code: document.getElementById("zip").value,

    service: document.getElementById("service").value,
    project_details: document.getElementById("details").value,

    contractor_id: selectedContractor.id,
    contractor_name: selectedContractor.company_name
  };

  // 🔥 THIS IS THE KEY FIX
  debug.innerText = JSON.stringify(payload, null, 2);

  try {
    const res = await fetch(API + "/leads", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Submission failed");
    }

    status.innerHTML = `
      ✅ Request submitted!<br><br>
      <a href="unlock.html?id=${data.lead_id}">
        👉 Open Unlock Page
      </a>
    `;

  } catch (err) {
    status.innerText = err.message;
  }
});

loadContractors();
</script>

</body>
</html>
