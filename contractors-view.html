<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge | Contractor Profile</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef4ff;
      color: #0f172a;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
    }

    .top {
      background: #0b1833;
      color: white;
      padding: 36px 24px;
      text-align: center;
    }

    .top h1 {
      margin: 0 0 10px;
      font-size: 44px;
      font-weight: 700;
    }

    .top p {
      margin: 0;
      font-size: 18px;
      opacity: 0.95;
    }

    .back-link {
      display: inline-block;
      margin: 22px 0;
      color: #2563eb;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-bottom: 24px;
    }

    .name {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .biz {
      font-size: 18px;
      color: #475569;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .field {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px;
    }

    .label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .value {
      font-size: 18px;
      color: #111827;
      word-break: break-word;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 18px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    input, textarea {
      width: 100%;
      padding: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 18px;
      font-size: 18px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      background: #2b55d4;
      color: white;
      border-radius: 18px;
      padding: 20px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .success, .error {
      margin-top: 16px;
      border-radius: 18px;
      padding: 18px;
      font-size: 17px;
      font-weight: 600;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .loading, .not-found {
      text-align: center;
      font-size: 22px;
      color: #6b7280;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>LeadForge</h1>
    <p>Homeowners choose the contractor they want — exclusive requests only.</p>
  </div>

  <div class="wrap">
    <a class="back-link" href="/contractors.html">← Back to Contractors</a>

    <div id="loading" class="loading">Loading contractor...</div>
    <div id="notFound" class="not-found" style="display:none;">Contractor not found.</div>

    <div id="profileCard" class="card" style="display:none;">
      <div class="name" id="contractorName">—</div>
      <div class="biz" id="businessName">—</div>
      <div class="badge">Approved</div>

      <div class="grid">
        <div class="field">
          <div class="label">Company</div>
          <div class="value" id="companyValue">—</div>
        </div>

        <div class="field">
          <div class="label">Email</div>
          <div class="value" id="emailValue">—</div>
        </div>

        <div class="field">
          <div class="label">Phone</div>
          <div class="value" id="phoneValue">—</div>
        </div>

        <div class="field">
          <div class="label">Service</div>
          <div class="value" id="serviceValue">—</div>
        </div>

        <div class="field">
          <div class="label">Location</div>
          <div class="value" id="locationValue">—</div>
        </div>
      </div>
    </div>

    <div id="formCard" class="card" style="display:none;">
      <div class="section-title">Request This Contractor</div>

      <form id="leadForm">
        <input id="name" type="text" placeholder="Your Name" required />
        <input id="email" type="email" placeholder="Your Email" required />
        <input id="phone" type="text" placeholder="Your Phone" required />
        <input id="city" type="text" placeholder="City" required />
        <input id="state" type="text" placeholder="State" required />
        <input id="zip" type="text" placeholder="ZIP Code" required />
        <textarea id="details" placeholder="Tell the contractor what you need" required></textarea>
        <button type="submit">Send Exclusive Request</button>
      </form>

      <div id="successBox" class="success"></div>
      <div id="errorBox" class="error"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://leadforge-llc.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const contractorId = params.get("id");

    const loadingEl = document.getElementById("loading");
    const notFoundEl = document.getElementById("notFound");
    const profileCard = document.getElementById("profileCard");
    const formCard = document.getElementById("formCard");
    const leadForm = document.getElementById("leadForm");
    const successBox = document.getElementById("successBox");
    const errorBox = document.getElementById("errorBox");

    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = message;
      successBox.style.display = "none";
      successBox.textContent = "";
    }

    function showSuccess(message) {
      successBox.style.display = "block";
      successBox.textContent = message;
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    async function loadContractor() {
      if (!contractorId) {
        loadingEl.style.display = "none";
        notFoundEl.style.display = "block";
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/contractors/${contractorId}`);
        const data = await response.json();

        if (!response.ok || !data || data.detail) {
          loadingEl.style.display = "none";
          notFoundEl.style.display = "block";
          return;
        }

        document.getElementById("contractorName").textContent =
          `${data.first_name || ""} ${data.last_name || ""}`.trim() || "Contractor";

        document.getElementById("businessName").textContent =
          data.business_name || data.company_name || "—";

        document.getElementById("companyValue").textContent =
          data.business_name || data.company_name || "—";

        document.getElementById("emailValue").textContent =
          data.email || "—";

        document.getElementById("phoneValue").textContent =
          data.phone || "—";

        document.getElementById("serviceValue").textContent =
          data.trade || data.category || data.services || "—";

        document.getElementById("locationValue").textContent =
          data.service_area || "—";

        loadingEl.style.display = "none";
        profileCard.style.display = "block";
        formCard.style.display = "block";
      } catch (error) {
        loadingEl.style.display = "none";
        notFoundEl.style.display = "block";
      }
    }

    leadForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      showSuccess("");
      showError("");

      const payload = {
        contractor_id: contractorId,
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        zip: document.getElementById("zip").value.trim(),
        details: document.getElementById("details").value.trim()
      };

      try {
        const response = await fetch(`${API_BASE}/leads`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && !data.detail) {
          showSuccess(data.message || "Request sent successfully!");
          leadForm.reset();
          return;
        }

        showError(data.detail || data.message || "Something went wrong.");
      } catch (error) {
        showError("Network error. Please try again.");
      }
    });

    loadContractor();
  </script>
</body>
</html>
