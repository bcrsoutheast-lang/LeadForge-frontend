<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request a Contractor | LeadForge LLC</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    .subtext {
      color: #6b7280;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <a class="back-link" href="index.html">← Back to Home</a>

    <div class="card">
      <h1>Request a Contractor</h1>
      <p class="subtext">
        Tell us about your project and we’ll connect you with a contractor ready to take the job.
      </p>
    </div>

    <div class="card">
      <h2>Project Details</h2>

      <form id="leadForm">

        <div class="row">
          <div>
            <label>Service Needed</label>
            <select id="service" required>
              <option value="">Select a service</option>
              <option>Roofing</option>
              <option>HVAC</option>
              <option>Siding</option>
              <option>Flooring</option>
              <option>Painting</option>
              <option>Kitchen Remodel</option>
              <option>Bathroom Remodel</option>
              <option>Deck / Fence</option>
              <option>Drywall</option>
              <option>Addition</option>
              <option>General Contractor</option>
            </select>
          </div>

          <div>
            <label>Zip Code</label>
            <input type="text" id="zip" required />
          </div>
        </div>

        <label>Project Description</label>
        <textarea id="description" required></textarea>

        <div class="row">
          <div>
            <label>Budget (optional)</label>
            <input type="text" id="budget" placeholder="$5,000 - $10,000" />
          </div>

          <div>
            <label>Timeline</label>
            <select id="timeline">
              <option value="">Select timeline</option>
              <option>ASAP</option>
              <option>1-2 weeks</option>
              <option>1 month</option>
              <option>Flexible</option>
            </select>
          </div>
        </div>

        <h2>Contact Info</h2>

        <div class="row">
          <div>
            <label>Full Name</label>
            <input type="text" id="name" required />
          </div>

          <div>
            <label>Phone</label>
            <input type="tel" id="phone" required />
          </div>
        </div>

        <label>Email</label>
        <input type="email" id="email" required />

        <label>Address</label>
        <input type="text" id="address" required />

        <button type="submit">Submit Request</button>
        <div id="messageBox" class="message"></div>

      </form>
    </div>
  </div>

  <script>
    const API = "https://leadforge-llc.onrender.com";
    const form = document.getElementById("leadForm");
    const messageBox = document.getElementById("messageBox");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        service_type: document.getElementById("service").value,
        zip_code: document.getElementById("zip").value,
        project_description: document.getElementById("description").value,
        budget: document.getElementById("budget").value,
        timeline: document.getElementById("timeline").value,
        homeowner_name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value
      };

      try {
        const res = await fetch(`${API}/leads`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Submission failed");

        showMessage("Request submitted successfully. A contractor will contact you soon.", "success");
        form.reset();
      } catch (err) {
        showMessage("Something went wrong. Please try again.", "error");
      }
    });
  </script>

</body>
</html>
