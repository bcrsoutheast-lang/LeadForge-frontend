<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contractors | LeadForge</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 8px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .sub {
      color: #666;
      margin: 5px 0;
    }

    .badge {
      display: inline-block;
      background: green;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Verified Contractors</h1>

    <div id="contractorList"></div>
  </div>

  <script>
    async function loadContractors() {
      try {
        const res = await fetch("https://leadforge-llc.onrender.com/contractors");
        const data = await res.json();

        const container = document.getElementById("contractorList");

        const approved = data.filter(c => 
          c.status === "approved" && c.verified === true
        );

        if (approved.length === 0) {
          container.innerHTML = "<div class='empty'>No verified contractors yet.</div>";
          return;
        }

        approved.forEach(c => {
          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <div class="title">${c.company_name}</div>
            <div class="sub">Owner: ${c.owner_name}</div>
            <div class="sub">${c.business_type}</div>
            <div class="sub">Service Area: ${c.service_area}</div>
            <div class="badge">Verified</div>
          `;

          container.appendChild(div);
        });

      } catch (err) {
        console.error(err);
      }
    }

    loadContractors();
  </script>

</body>
</html>
