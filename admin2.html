<!DOCTYPE html>
<html>
<head>
  <title>Admin Test</title>
</head>
<body style="font-family: Arial; padding: 40px;">

<h1>Admin Page Test</h1>

<div id="status">Loading...</div>

<script>
const url = "https://leadforge-llc.onrender.com/admin";

document.getElementById("status").innerText = "Fetching...";

fetch(url)
  .then(res => res.json())
  .then(data => {
    document.getElementById("status").innerText =
      "SUCCESS: Loaded " + (data.length || "data");
  })
  .catch(err => {
    document.getElementById("status").innerText =
      "ERROR: " + err.message;
  });
</script>

</body>
</html>
