<!DOCTYPE html>
<html>
<head>
  <title>Contractor Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: Arial; padding: 20px;">

<h2>Request This Contractor</h2>

<form id="leadForm">
  <input type="text" id="name" placeholder="Your Name" required /><br><br>
  <input type="email" id="email" placeholder="Your Email" required /><br><br>
  <input type="text" id="phone" placeholder="Your Phone" required /><br><br>
  <input type="text" id="city" placeholder="City" required /><br><br>
  <input type="text" id="state" placeholder="State" required /><br><br>
  <input type="text" id="zip" placeholder="ZIP Code" required /><br><br>

  <textarea id="details" placeholder="Project details" required></textarea><br><br>

  <button type="submit">Send Exclusive Request</button>
</form>

<br>
<div id="message" style="color:green;"></div>
<div id="error" style="color:red;"></div>

<script>
const params = new URLSearchParams(window.location.search);
const contractorId = params.get("id");

document.getElementById("leadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    contractor_id: contractorId,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    city: document.getElementById("city").value,
    state: document.getElementById("state").value,
    zip: document.getElementById("zip").value,
    details: document.getElementById("details").value
  };

  try {
    const res = await fetch("https://leadforge-llc.onrender.com/leads", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok) {
      document.getElementById("message").innerText = "Request sent successfully!";
      document.getElementById("error").innerText = "";
    } else {
      document.getElementById("error").innerText = data.detail || "Error occurred";
      document.getElementById("message").innerText = "";
    }

  } catch (err) {
    document.getElementById("error").innerText = "Network error";
  }
});
</script>

</body>
</html>
