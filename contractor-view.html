<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge Request</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #eef3fb;
      color: #111827;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
      line-height: 1.1;
    }

    .contractor-box {
      background: #f8fafc;
      border: 1px solid #dbe4f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .contractor-name {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .contractor-meta {
      margin: 4px 0;
      color: #475569;
      font-size: 16px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin: 16px 0 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      background: #ffffff;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      background: #2563eb;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1.4;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.success {
      background: #e7f7ea;
      border: 1px solid #b7e2c0;
      color: #166534;
    }

    .msg.error {
      background: #fde8e8;
      border: 1px solid #f4b4b4;
      color: #991b1b;
    }

    .loading {
      font-size: 18px;
      color: #475569;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 10px;
      }

      .card {
        padding: 18px;
      }

      h1 {
        font-size: 28px;
      }

      .contractor-name {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>LeadForge Request</h1>

      <div id="loading" class="loading">Loading contractor...</div>

      <div id="contractorBox" class="contractor-box" style="display:none;">
        <div id="contractorName" class="contractor-name">Contractor</div>
        <div id="contractorCategory" class="contractor-meta"></div>
        <div id="contractorLocation" class="contractor-meta"></div>
        <div id="contractorEmail" class="contractor-meta"></div>
        <div id="contractorPhone" class="contractor-meta"></div>
      </div>

      <form id="leadForm">
        <label for="name">Your Name</label>
        <input id="name" type="text" />

        <label for="email">Email</label>
        <input id="email" type="email" />

        <label for="phone">Phone</label>
        <input id="phone" type="tel" />

        <label for="details">Details</label>
        <textarea id="details"></textarea>

        <button id="submitBtn" type="submit">Send Request</button>

        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://leadforge-llc.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const contractorId = params.get("id");

    const loading = document.getElementById("loading");
    const contractorBox = document.getElementById("contractorBox");
    const contractorName = document.getElementById("contractorName");
    const contractorCategory = document.getElementById("contractorCategory");
    const contractorLocation = document.getElementById("contractorLocation");
    const contractorEmail = document.getElementById("contractorEmail");
    const contractorPhone = document.getElementById("contractorPhone");

    const leadForm = document.getElementById("leadForm");
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function safeValue(value) {
      if (value === null || value === undefined) return "";
      return String(value).trim();
    }

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = "msg show " + type;
    }

    function clearMessage() {
      msg.textContent = "";
      msg.className = "msg";
    }

    async function loadContractor() {
      if (!contractorId) {
        loading.textContent = "Missing contractor ID.";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/contractors/${contractorId}`);
        const data = await res.json();

        if (!res.ok || !data || data.detail) {
          throw new Error(data.detail || "Contractor not found");
        }

        contractorName.textContent =
          safeValue(data.business_name) ||
          safeValue(data.company_name) ||
          safeValue(data.name) ||
          "Contractor";

        contractorCategory.textContent =
          safeValue(data.category) ||
          safeValue(data.trade) ||
          safeValue(data.service_type) ||
          "";

        contractorLocation.textContent =
          [safeValue(data.city), safeValue(data.state), safeValue(data.zip)]
            .filter(Boolean)
            .join(", ");

        contractorEmail.textContent = safeValue(data.email)
          ? `Email: ${safeValue(data.email)}`
          : "";

        contractorPhone.textContent = safeValue(data.phone)
          ? `Phone: ${safeValue(data.phone)}`
          : "";

        loading.style.display = "none";
        contractorBox.style.display = "block";
      } catch (error) {
        loading.textContent = error.message || "Could not load contractor.";
      }
    }

    leadForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessage();

      const payload = {
        contractor_id: contractorId,
        name: safeValue(document.getElementById("name").value),
        email: safeValue(document.getElementById("email").value),
        phone: safeValue(document.getElementById("phone").value),
        details: safeValue(document.getElementById("details").value)
      };

      if (!payload.name) {
        showMessage("Please enter your name.", "error");
        return;
      }

      if (!payload.email && !payload.phone) {
        showMessage("Please enter an email or phone number.", "error");
        return;
      }

      if (!payload.details) {
        showMessage("Please enter details.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const res = await fetch(`${API_BASE}/leads`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.detail || data.message || "Could not send request.");
        }

        showMessage(data.message || "Lead created", "success");
        leadForm.reset();
      } catch (error) {
        showMessage(error.message || "Could not send request.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Request";
      }
    });

    loadContractor();
  </script>
</body>
</html>
